# Move to .github/workflows/test.yml (needs a token with "workflow" scope).
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r astrion_config_manager/requirements.txt pytest pytest-aiohttp pytest-asyncio ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
