# Move to .github/workflows/build.yml (needs a token with "workflow" scope).
# Build smoke test of the app image for the two supported architectures.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: astrion_config_manager
          platforms: ${{ matrix.platform }}
          push: false
